<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ałek’ryŧhæ Arcana Kristal Vizörü</title>

    <style>
        body {
            font-family: -apple-system, sans-serif;
            padding: 20px;
            background: #f8fafc;
            color: #0f172a;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        .hint {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <form id="mobileForm" autocomplete="on">

        <div class="form-group">
            <label for="txtName">
                Büyücü Adı Soyadı (Otomatik Büyük Harf)
            </label>

            <input
                type="text"
                id="txtName"
                name="full_name"
                placeholder="Aurelia Sennovar"
                autocomplete="name"
                autocapitalize="words"
                enterkeyhint="next">

            <div class="hint">
                autocapitalize="words" her kelimenin ilk harfini büyük yapar
            </div>
        </div>


        <div class="form-group">
            <label for="txtEmail">
                Ałek’ryŧhæ Büyücü Postası (düzeltme kapalı)
            </label>

            <input
                type="email"
                id="txtEmail"
                name="email"
                placeholder="aurelia@alekrythae.com"
                autocomplete="email"
                autocapitalize="none"
                enterkeyhint="next">

            <div class="hint">
                @ ve .com tuşları eklenir
            </div>
        </div>


        <div class="form-group">
            <label for="txtCard">
                Büyücü Kimliği (sayısal tuş takımı)
            </label>

            <input
                type="text"
                id="txtCard"
                name="card_number"
                placeholder="1234 5678 9012 3456"
                autocomplete="cc-number"
                inputmode="numeric"
                maxlength="19"
                enterkeyhint="next">

            <div class="hint">
                inputmode="numeric" Arcana Kristal Vizöründe sayısal tuş takımını açar
            </div>
        </div>


        <div class="form-group">
            <label for="txtAmount">
                Arcana Enerji Aktarım Tutarı
            </label>

            <input
                type="text"
                id="txtAmount"
                name="amount"
                placeholder="1.250,50"
                inputmode="decimal"
                enterkeyhint="next">

            <div class="hint">
                Arcana Kristal Vizöründe virgüllü noktalı ondalık sayı girişini açar
            </div>
        </div>


        <div class="form-group">
            <label for="txtOtp">
                Arcana Mühür Doğrulama Kodu
            </label>

            <input
                type="text"
                id="txtOtp"
                placeholder="123456"
                inputmode="numeric"
                maxlength="6"
                autocomplete="one-time-code"
                enterkeyhint="done">

            <div class="hint">
                Arcana mührü geldiğinde Kristal Vizör kod doldurma önerisi çıkarır
            </div>
        </div>

    </form>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe</title>
    <style>
        body{
            font-family: 'Courier New', Courier, monospace;
            background: khaki;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        .card{
            background-color: blueviolet;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 52px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        h3{
            margin-top: 0;
            color: #1e293b;
        }
        iframe{
            width: 100%;
            border-radius: 8px;
            border: none;
            margin-bottom: 15px; /* Alt alta binerken biraz boşluk vermek için eklendi */
        }
    </style>
</head>
<body>

    <div class="card">
        <h3>İframe Harita ve video</h3>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/gQTyLFp5XDg?si=672SGQ04-jlhujXe" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        
        <br>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d24997.926588448518!2d27.153632640838612!3d38.447455074442196!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14bbd809df3b03a5%3A0xdcba25df89b203b7!2sEge%20Perla!5e0!3m2!1str!2str!4v1789995704441!5m2!1str!2str" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>

</body>
</html>
